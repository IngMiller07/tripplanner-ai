<rect width="1720" height="1000" fill="#ffffff"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#0d2b33" text-anchor="start">TripPlanner AI - Arquitectura con dos canales independientes</text>
<text x="40" y="72" font-size="14.5" font-weight="400" fill="#4a646d" text-anchor="start">Canal 1 (REST) para operaciones de negocio. Canal 2 (HTTP streaming) para el sistema multi-agente. API Gateway no participa en el streaming.</text>
